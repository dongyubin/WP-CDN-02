name: Sync CloudFlare R2
# on: push
on:
  workflow_run:
    workflows: ["Image Conversion"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      unconditional-invoking:
        description: 'CloudFlare R2同步文件'
        type: boolean
        required: true
        default: true

concurrency:
  group: sync-cloudflare-r2
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # 取执行时的最新 main，避免排队期间产生的新提交被跳过
        ref: main
    - run: rm -rf .git .github
    # Setup Rclone
    - name: Setup Rclone
      uses: AnimMouse/setup-rclone@v1
      with:
        rclone_config: ${{ secrets.RCLONE_CONFIG }}
    - name: Rclone Sync Cloudflare
      run: |
          rclone copy ./ cloudflare_r2:${{ secrets.CF_R2_BUCKET }}/wp-cdn-02 --transfers=8 --checkers=16 --exclude=.git/** --exclude=.github/** --exclude=README.md
